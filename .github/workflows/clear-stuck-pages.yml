name: Refresh Pages build
on:
  push:
    paths:
      - .github/workflows/clear-stuck-pages.yml
permissions:
  contents: read
  pages: write
jobs:
  request-pages-build:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Request a fresh build from the configured Pages source
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --method POST repos/tychen0927/tychen0927.github.io/pages/builds
