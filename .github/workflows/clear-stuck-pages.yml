name: Clear stuck Pages deployment
on:
  push:
    paths:
      - .github/workflows/clear-stuck-pages.yml
permissions:
  contents: read
  pages: write
jobs:
  clear-stuck-deployment:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Cancel the specific stale Pages deployment
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --method POST repos/tychen0927/tychen0927.github.io/pages/deployments/6410f91044c46d96ad8b59975218e837b66fc04f/cancel
